variables:
  core_parameters:
    data_split: search
    score: pooled_pointwise_f1
  PROBLEM_TYPE: anomaly_detection
  MAX_RUNTIME: 120
  score_transform:
    score_range_min: 0.0
    score_range_max: 1.0
    alpha: 1.0
    optimize_mode: maximize
    positive_multiplier: 1.0
checkpoint_interval: 10
max_code_length: 50000
log_level: INFO
llm:
  models:
  - name: REPLACE_WITH_VLLM_SERVED_MODEL
    weight: 1.0
  api_base: http://localhost:8000/v1
  api_key: EMPTY
  temperature: 0.7
  top_p: 0.95
  max_tokens: 16384
  timeout: 600
  retries: 3
  retry_delay: 5
prompt:
  use_alphaevolve_style: true
  use_system_prompt: true
  use_system_message_sampling: true
  system_message_list:
  - weight: 1.0
    message: 'You are an expert in time-series anomaly detection and numerical Python. You are improving
      one function of a program through repeated rounds of edits; each edit is run and scored automatically.


      The task: monitoring metrics (KPIs) from production services were forecast by a fixed model. For
      each KPI, `detect_anomalies(error, missing)` receives `error`, a 1-D float32 NumPy array of forecast
      errors (actual minus forecast) in time order with about 150,000 points, and `missing`, a boolean
      array of the same shape marking points that had no measurement. It must return a boolean array of
      the same shape that is True where the point is anomalous. The function is called once per KPI and
      sees only that KPI.


      The score is pointwise F1 pooled over all KPIs: every flagged point that is not labeled anomalous
      costs precision, and every labeled point that is not flagged costs recall. Missing points are not
      scored. Anomalies are rare, around 1% of points, and the labels are not available to the program.


      You are free to use any detection method, for example robust or rolling statistics, adaptive thresholds,
      smoothing, differencing, or combining several signals. The edit only counts if it runs, so follow
      these rules:

      - Keep the signature `detect_anomalies(error: np.ndarray, missing: np.ndarray) -> np.ndarray` and
      return a boolean array with the same shape as `error`.

      - Use only NumPy (already imported as `np`) and the Python standard library. Do not import other
      packages.

      - Use vectorized NumPy operations. A Python loop over every point is too slow and will time out.

      - Never flag a missing point, and do not let missing points distort your statistics.

      - Handle edge cases without raising: zero spread, NaN from empty slices, windows longer than the
      array.

      - Do not read or write files and do not change code outside the EVOLVE-BLOCK.

      '
  num_top_programs: 2
  num_diverse_programs: 0
  num_inspiration_programs: 0
  use_template_stochasticity: true
  include_artifacts: true
  max_artifact_bytes: 16384
  artifact_security_filter: true
  template_dir: ../prompts
  history_evolve_block_only: true
database:
  population_size: 1000
  archive_size: 10
  num_islands: 4
  feature_dimensions:
  - score
  - complexity
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.6
  log_prompts: true
evaluator:
  timeout: 150
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false
  enable_artifacts: true
  collect_runtime_environments: false
  preserve_temp_directories: false
  copy_files:
  - ../data/kpi_search.npz: data/kpi_search.npz
diff_based_evolution: true
allow_full_rewrites: false
